[package]
name = "ftdx3000-rig"
description = "FTDX3000 rig engine: auto-detect, serial CAT engine, virtual port sharing, rigctld server, simulator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crossbeam-channel = "0.5.17"
ftdx3000-cat.workspace = true
hmac = "0.13.0"
log.workspace = true
nix = { version = "0.31.3", features = ["term", "fs", "poll", "signal", "ioctl", "net", "hostname"] }
parking_lot = "0.13.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serialport = { version = "4.10.1", default-features = false, features = ["usbportinfo-interface"] }
sha2 = "0.11.1"
socket2 = { version = "0.6.5", features = ["all"] }
toml = "1.1.8"

[dependencies.env_logger]
version = "0.11.11"

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18.2"

