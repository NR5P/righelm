[package]
name = "righelm"
description = "RigHelm — the Linux alternative to Win4Yaesu for the Yaesu FTDX3000"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", features = ["glow"] }
env_logger = "0.11.11"
ftdx3000-cat.workspace = true
ftdx3000-rig.workspace = true
log.workspace = true
parking_lot = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
